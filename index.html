<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/icon.png">
</head>
<body>
    <h1>Neural Network V1.0</h1>
    <label for="numOfRuns">Number of Runs: </label><input id="numOfRuns" type="number">
    <button id="runTraining">Run Training</button>
    <h5 id="outcomeOfTrains">Train 0 out of 0</h5>
    <label for="humanInput">Input Question: </label><input placeholder="Enter text here..." id="humanInput" type="text">
    <button id="submitQuestion">Submit Question</button>
    <input readonly id="robotOutput" placeholder="My output goes here...">
    <script src="training.js"></script>
    <script src="main.js"></script>
</body>
</html>
