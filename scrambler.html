<!DOCTYPE html>
<html>
<lang en="us">
<body>
    <h1>Really Cool Sentence Scrambler</h1>
    <textarea id="input"></textarea>
    <textarea readonly id="output"></textarea>
    <script>
        const input = document.getElementById("input");
        const output = document.getElementById("output");
        input.oninput = function() {
            let inputWords = input.value.split(/[.,;\s-]/);
            if (inputWords.length < 2) {
                output.innerText = inputWords;
                console.log("i canceled early")
                return;
            }
            let randomArray = Array(inputWords.length)
            for (let i = 0; i < inputWords.length; i++) {
                let randomPick = Math.floor(Math.random() * inputWords.length);
                while(randomArray[randomPick] !== undefined) {
                    randomPick = Math.floor(Math.random() * inputWords.length);
                }
                randomArray[randomPick] = inputWords[i];
            }
            output.value = randomArray.join(",").replaceAll(",", " ");
        }
    </script>
</body>
</html>
